version: '3.8'

services:
  # =======================================================
  # Service Web Smart Locker (PHP Native + Apache)
  # Port Host: 4060 -> Port Container: 80
  # Menggunakan MariaDB/MySQL yang sudah ada di port 3306
  # =======================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartlocker_web
    restart: always
    environment:
      # Koneksi ke MariaDB yang sudah berjalan di server
      DB_HOST: "192.168.2.2"
      DB_USER: "web"
      DB_PASS: ""                  # Isi password user MariaDB Anda jika ada
      DB_NAME: "smart_locker"
      DB_PORT: 3306
    ports:
      - "4060:80"                  # Aplikasi diakses via: http://192.168.2.2:4060
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
