version: '3.8'

services:
  # =======================================================
  # Service Web Smart Locker (PHP Native + Apache + PDO)
  # Menggunakan Database MySQL yang sudah ada di server
  # =======================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartlocker_web
    restart: always
    environment:
      # Arahkan ke IP server MySQL yang sudah ada
      DB_HOST: "192.168.2.2"
      DB_USER: "web"
      DB_PASS: ""                  # Isi password user 'web' MySQL Anda jika ada
      DB_NAME: "smart_locker"
      DB_PORT: 3306
    ports:
      - "8080:80"                  # Akses web di: http://<IP_SERVER>:8080
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
